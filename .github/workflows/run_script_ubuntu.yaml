name: Run R scripts

permissions:
  contents: write

concurrency:
  group: run-script-ubuntu-${{ github.ref }}
  cancel-in-progress: true

on: 
  push:
    paths:
      - .github/workflows/run_script_ubuntu.yaml
      - reports/karup/**
      - reports/skjern/**
      - reports/mv-lf/**
      - reports/index.md
      - script_karup.R
      - script_mv-lf.R
      - script_skjern.R
      - riverdata-package/**
      - functions.R
      - renv.lock
      
  schedule:
    - cron: '30 * * * *'  # every hour
  # branches-ignore:
  #     - '**'
jobs:
  render:
    name: Run scripts
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_FTP: ${{ secrets.GH_FTP }}
      R_COMPILE_AND_INSTALL_PACKAGES: never
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      
      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: false   # may result in error if true if binary is mission on rspm
    
      - name: Install dependices
        run: |
          sudo apt-get -y update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libsqlite3-dev libfontconfig1-dev libcairo2-dev libharfbuzz-dev libfribidi-dev libudunits2-dev libuv1-dev
          # CLEAN APT CACHES & TEMP
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 3

      - name: Install local riverdata package
        run: R CMD INSTALL riverdata-package
          
      - name: Run R script Karup
        run: Rscript script_karup.R
        
      - name: Run R script Skjern
        run: Rscript script_skjern.R
        
      - name: Run R script MV-LF
        run: Rscript script_mv-lf.R
        
      - name: Check disk usage
        run: |
          echo "Disk usage:"
          df -h
          echo "Largest directories:"
          du -h . | sort -h | tail -n 30
          
      - name: Clean R caches
        run: |
          Rscript -e 'cat("renv cache:", renv::paths$cache(), "\n"); unlink(renv::paths$cache(), recursive = TRUE, force = TRUE)'
          Rscript -e 'unlink(tempdir(), recursive = TRUE, force = TRUE)'
          
      - name: Commit results
        # if: github.event_name == 'schedule'  # only commit scheduled jobs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(data/*.csv docs/**/*.html)
          if ((${#files[@]})); then
            git add "${files[@]}"
          fi
          if git diff --cached --quiet; then
            echo "No generated report changes to commit."
            exit 0
          fi
          git commit -m "gHA build: ${{ github.run_number }}"
          for attempt in 1 2 3; do
            git fetch --depth=20 origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after rebase..."
            sleep 5
          done
          echo "Could not push generated report commit after retries."
          exit 1
