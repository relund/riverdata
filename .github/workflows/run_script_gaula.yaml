name: Run Gaula data script

permissions:
  contents: write

concurrency:
  group: run-script-gaula-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - .github/workflows/run_script_gaula.yaml
      - reports/gaula/**
      - script_gaula.R
      - renv.lock

  schedule:
    - cron: '29 * * * *'  # every hour

jobs:
  render:
    name: Run Gaula script
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_COMPILE_AND_INSTALL_PACKAGES: never

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: false

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get install -y cmake gdal-bin libabsl-dev pandoc libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev libfontconfig1-dev libfreetype6-dev libcairo2-dev libharfbuzz-dev libfribidi-dev libudunits2-dev libuv1-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*

      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 3

      - name: Run Gaula data script
        run: Rscript script_gaula.R

      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gaula-history.json docs/gaula/*
          if git diff --cached --quiet; then
            echo "No Gaula data changes to commit."
            exit 0
          fi
          git commit -m "gHA Gaula data build: ${{ github.run_number }}"
          for attempt in 1 2 3; do
            git fetch --depth=20 origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after rebase..."
            sleep 5
          done
          echo "Could not push Gaula data commit after retries."
          exit 1
