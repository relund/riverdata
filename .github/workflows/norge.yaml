name: Run Norge data scripts

permissions:
  contents: write

concurrency:
  group: run-script-norge-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - .github/workflows/norge.yaml
      - reports/gaula/**
      - reports/stjordal/**
      - script_gaula.R
      - script_lrn.R
      - renv.lock

  schedule:
    - cron: '17 * * * *'  # every hour

jobs:
  render:
    name: Run Norge scripts
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_COMPILE_AND_INSTALL_PACKAGES: never

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: false

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get install -y cmake gdal-bin libabsl-dev pandoc libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev libfontconfig1-dev libfreetype6-dev libcairo2-dev libharfbuzz-dev libfribidi-dev libudunits2-dev libuv1-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*

      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 3

      - name: Configure git user
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Gaula data script
        id: gaula_script
        continue-on-error: true
        run: Rscript script_gaula.R

      - name: Stage Gaula results
        id: gaula_changes
        if: steps.gaula_script.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add data/gaula-history.json docs/gaula/*
          if git diff --cached --quiet; then
            echo "No Gaula data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Gaula results
        if: steps.gaula_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "gHA Gaula data build: ${{ github.run_number }}"

      - name: Push Gaula results
        if: steps.gaula_changes.outputs.changed == 'true'
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          pull: rebase

      - name: Run Stjordal data script
        id: stjordal_script
        continue-on-error: true
        run: Rscript script_lrn.R

      - name: Stage Stjordal results
        id: stjordal_changes
        if: steps.stjordal_script.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add data/stjordal-history.json docs/stjordal/*
          if git diff --cached --quiet; then
            echo "No Stjordal data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Stjordal results
        if: steps.stjordal_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "gHA Stjordal data build: ${{ github.run_number }}"

      - name: Push Stjordal results
        if: steps.stjordal_changes.outputs.changed == 'true'
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          pull: rebase

      - name: Fail if a data script failed
        if: steps.gaula_script.outcome == 'failure' || steps.stjordal_script.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::One or more Norge data scripts failed."
          exit 1
